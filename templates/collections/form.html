{% extends "base.html" %}
{% block title %}New collection{% endblock %}
{% block content %}
<div class="page-head"><div>
  <h1 class="page-title">New collection</h1>
  <p class="page-sub mb-0">Private, public or shared with specific members.</p>
</div></div>
<form class="card" method="post" style="max-width:560px">
  {% csrf_token %}
  <div class="card-body">
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<p class="fg-3 mb-0">{{ error }}</p>{% endfor %}
    </div>
    {% endfor %}
    <button class="btn-solid theme-primary" type="submit">Create</button>
  </div>
</form>
{% endblock %}
